<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema AVT - Registrar Equipo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Barra superior -->
    <header class="bg-white shadow-md fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-3">
                    <button onclick="window.location.href='registro.html'" class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center hover:bg-gray-200 transition-colors">
                        <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
                    </button>
                    <div class="w-10 h-10 bg-red-700 rounded-lg flex items-center justify-center">
                        <i data-lucide="users" class="w-6 h-6 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-red-700">Registrar Equipo</h1>
                </div>
                
                <div class="flex items-center space-x-3">
                    <span class="text-gray-700">Hola, <span class="font-semibold">Usuario</span></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="pt-20 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="bg-white rounded-xl shadow-md p-8">
            <form id="formEquipo">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Nombre del equipo -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre del Equipo *</label>
                        <input type="text" id="nombreEquipo" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700" placeholder="Ej: Tigres FC">
                    </div>

                    <!-- Categoría -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Categoría *</label>
                        <select id="categoria" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                            <option value="">Seleccionar categoría</option>
                            <option value="infantil">Infantil</option>
                            <option value="juvenil">Juvenil</option>
                            <option value="primera">Primera División</option>
                            <option value="veteranos">Veteranos</option>
                        </select>
                    </div>

                    <!-- Localidad -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Localidad *</label>
                        <input type="text" id="localidad" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700" placeholder="Ej: Ciudad de México">
                    </div>

                    <!-- Club -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Club</label>
                        <input type="text" id="club" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700" placeholder="Ej: Club Deportivo Central">
                    </div>

                    <!-- Liga asociada -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Liga Asociada *</label>
                        <select id="ligaAsociada" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                            <option value="">Seleccionar liga</option>
                            <option value="municipal">Liga Municipal de Fútbol</option>
                            <option value="juvenil">Liga Juvenil</option>
                            <option value="femenil">Liga Femenil</option>
                        </select>
                    </div>

                    <!-- Entrenador -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Entrenador *</label>
                        <select id="entrenador" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                            <option value="">Seleccionar entrenador</option>
                            <option value="carlos">Carlos Martínez</option>
                            <option value="ana">Ana López</option>
                            <option value="miguel">Miguel González</option>
                        </select>
                    </div>
                </div>

                <!-- Botón guardar -->
                <div class="mt-8 text-center">
                    <button type="submit" class="bg-red-700 text-white py-3 px-8 rounded-xl hover:bg-red-800 transition-all font-semibold">
                        <i data-lucide="users" class="w-5 h-5 inline mr-2"></i>
                        Guardar Equipo
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();

        document.getElementById('formEquipo').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombreEquipo').value;
            const categoria = document.getElementById('categoria').value;
            const localidad = document.getElementById('localidad').value;
            const liga = document.getElementById('ligaAsociada').value;
            const entrenador = document.getElementById('entrenador').value;

            if (!nombre || !categoria || !localidad || !liga || !entrenador) {
                alert('Por favor complete todos los campos requeridos');
                return;
            }

            alert('Equipo registrado exitosamente');
            this.reset();
        });
    </script>
</body>
</html>
