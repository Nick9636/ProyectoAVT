<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Inicio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>

<body class="min-h-screen flex flex-col">
    {% include 'header.html' %}
    <!-- CONTENIDO -->
    <main class="flex-1 flex items-center justify-center px-3 py-12 pt-24">
        <div class="w-full max-w-5xl">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

                <!-- NOTIFICACIONES -->
                <a href="{{ url_for('principal.notificaciones') }}"
                    class="card cursor-pointer block">
                    <div class="p-8 text-center">
                        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="bell" class="w-8 h-8 text-red-700"></i>
                        </div>
                        <h3 class="text-xl font-semibold text-black mb-2">Notificaciones</h3>
                        <p class="text-white">Ver mensajes y alertas del sistema</p>
                    </div>
                </a>

                <!-- EXPEDIENTES -->
                <a href="{{ url_for('principal.expedientes') }}"
                    class="card cursor-pointer block">
                    <div class="p-8 text-center">
                        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="file-text" class="w-8 h-8 text-red-700"></i>
                        </div>
                        <h3 class="text-xl font-semibold text-black mb-2">Generar Expediente</h3>
                        <p class="text-white">Crear expedientes SIRED de afiliados</p>
                    </div>
                </a>

                <!-- DIGITALIZAR -->
                <a href="{{ url_for('principal.digitalizar') }}"
                    class="card cursor-pointer block">
                    <div class="p-8 text-center">
                        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="upload" class="w-8 h-8 text-red-700"></i>
                        </div>
                        <h3 class="text-xl font-semibold text-black mb-2">Digitalizar Documentos</h3>
                        <p class="text-white">Subir y almacenar archivos digitales</p>
                    </div>
                </a>

            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        function toggleMenu() {
            const menu = document.getElementById("mobileMenu");
            if (menu) {
                menu.classList.toggle("hidden");
            }
        }

        document.addEventListener("click", function (event) {
            const menu = document.getElementById("mobileMenu");
            if (!menu) return;

            const button = event.target.closest("button");

            if (!menu.contains(event.target) && !button) {
                menu.classList.add("hidden");
            }
        });
    </script>

</body>
</html>
