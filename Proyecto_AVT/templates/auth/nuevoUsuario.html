<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nuevo Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/usuarioContraseña.css') }}">
</head>

<body>

    <img src="{{ url_for('static', filename='img/byteers_logo.png') }}" alt="Logo compañia" class="logobyteers">

    <div class="bg-circles" aria-hidden="true"></div>
    <div class="bg-circles2" aria-hidden="true"></div>

    <div class="card-wrap">
        <div class="card" role="main">

            <div class="card-logos">
                <img src="{{ url_for('static', filename='img/logoAVT_vector.png') }}" alt="Logo AVT">
                <img src="{{ url_for('static', filename='img/fmvb_logo.jpg') }}" alt="Logo FMVB">
            </div>

            <h2>Nuevo Usuario</h2>

            <!-- Mensajes flash -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.nuevoUsuario') }}" onsubmit="return validarForm()">

                <label>Nombre de usuario</label>
                <div class="input-box">
                    <input type="text" name="nombre_usuario" placeholder="Nombre de usuario" required>
                </div>

                <label>Nombre completo</label>
                <div class="input-box">
                    <input type="text" name="nombre_completo" placeholder="Nombre completo" required>
                </div>

                <label>Correo electrónico</label>
                <div class="input-box">
                    <input type="email" name="email" placeholder="Correo electrónico" required>
                </div>

                <label>Contraseña</label>
                <div class="input-box">
                    <input id="password" type="password" name="password" placeholder="Contraseña" required>
                    <div class="eye" onclick="togglePass('password')">👁</div>
                </div>

                <label>Confirmar contraseña</label>
                <div class="input-box">
                    <input id="password2" type="password" placeholder="Confirmar contraseña" required>
                    <div class="eye" onclick="togglePass('password2')">👁</div>
                </div>

                <p id="error-pass" style="color:red; display:none;">Las contraseñas no coinciden</p>

                <div class="btn-wrap">
                    <button type="submit">Registrarse</button>
                </div>
            </form>

        </div>
    </div>

    <script>
        function togglePass(id) {
            const p = document.getElementById(id);
            p.type = (p.type === 'password') ? 'text' : 'password';
        }

        function validarForm() {
            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('password2').value;
            const error = document.getElementById('error-pass');

            if (p1 !== p2) {
                error.style.display = 'block';
                return false; // detiene el envío del form
            }
            error.style.display = 'none';
            return true;
        }
    </script>

</body>
</html>
