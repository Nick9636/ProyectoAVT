<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recordar contraseña</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/usuarioContraseña.css', v=1) }}">
</head>

<body>
    <img src="{{ url_for('static', filename='img/byteers_logo.png') }}" alt="Byteers Logo" class="logobyteers">

    <div class="card-wrap">
        <div class="card" role="main">
            <div class="card-logos">
                <img src="{{ url_for('static', filename='img/logoAVT_vector.png') }}" alt="Logo tarjeta izquierdo">
                <img src="{{ url_for('static', filename='img/fmvb_logo.jpg') }}" alt="Logo tarjeta derecho">
            </div>

            <h2>Recordar contraseña</h2>

            <!-- Fase 1: Email -->
            <div id="fase-email">
                <label for="email">Ingresa correo para verificación</label>
                <div class="input-box">
                    <input id="email" name="email" type="email" placeholder="Correo electrónico" required />
                </div>
                <div class="btn-wrap">
                    <button type="button" onclick="solicitarCodigo()">Enviar código</button>
                </div>
            </div>

            <!-- Fase 2: Código y nueva contraseña -->
            <div id="fase-cambio" style="display:none;">
                <label for="token">Código de verificación</label>
                <div class="input-box">
                    <input id="token" name="token" type="text" placeholder="Código de 6 dígitos" maxlength="6"
                        required />
                </div>

                <label for="new_password">Ingresa nueva contraseña</label>
                <div class="input-box">
                    <input id="new_password" name="new_password" type="password" placeholder="Contraseña" />
                    <div class="eye" onclick="togglePass('new_password')" title="Mostrar / ocultar contraseña">👁</div>
                </div>

                <label for="confirm_password">Confirmar nueva contraseña</label>
                <div class="input-box">
                    <input id="confirm_password" name="confirm_password" type="password"
                        placeholder="Confirmar contraseña" />
                    <div class="eye" onclick="togglePass('confirm_password')" title="Mostrar / ocultar contraseña">👁
                    </div>
                </div>

                <div class="btn-wrap">
                    <button type="button" onclick="cambiarPassword()">Guardar</button>
                </div>

                <p style="text-align: center; margin-top: 10px;">
                    <a href="#" onclick="volverAEmail()">← Usar otro correo</a>
                </p>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <a href="{{ url_for('auth.iniciarSesion') }}">← Volver al inicio de sesión</a>
            </div>
        </div>
    </div>

    <script>
        let emailUsuario = '';

        function togglePass(inputId) {
            const p = document.getElementById(inputId);
            p.type = (p.type === 'password') ? 'text' : 'password';
        }

        async function solicitarCodigo() {
            const email = document.getElementById('email').value;

            if (!email) {
                alert('Por favor ingresa tu correo electrónico');
                return;
            }

            try {
                const response = await fetch('/auth/solicitarCodigo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (data.success) {
                    // Si estamos en desarrollo y tenemos el token, lo mostramos
                    if (data.debug_token) {
                        alert(`[DESARROLLO] Código: ${data.debug_token}`);
                        document.getElementById('token').value = data.debug_token;
                    } else {
                        alert('Se ha enviado un código de verificación a tu email');
                    }

                    document.getElementById('fase-email').style.display = 'none';
                    document.getElementById('fase-cambio').style.display = 'block';
                } else {
                    alert(data.message || 'Error al enviar el código');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        }

        async function cambiarPassword() {
            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (!token || !newPassword || !confirmPassword) {
                alert('Todos los campos son obligatorios');
                return;
            }

            if (token.length !== 6) {
                alert('El código debe tener 6 dígitos');
                return;
            }

            if (newPassword !== confirmPassword) {
                alert('Las contraseñas no coinciden');
                return;
            }

            if (newPassword.length < 6) {
                alert('La contraseña debe tener al menos 6 caracteres');
                return;
            }

            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Guardando...';

            try {
                const response = await fetch('/auth/cambiarPassword', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: emailUsuario,
                        token: token,
                        password: newPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert('¡Contraseña cambiada exitosamente!');
                    window.location.href = "{{ url_for('auth.iniciarSesion') }}";
                } else {
                    alert(data.message || 'Error al cambiar la contraseña');
                }
            } catch (error) {
                alert('Error de conexión. Intenta nuevamente.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Guardar';
            }
        }

        function volverAEmail() {
            document.getElementById('fase-cambio').style.display = 'none';
            document.getElementById('fase-email').style.display = 'block';
            document.getElementById('token').value = '';
            document.getElementById('new_password').value = '';
            document.getElementById('confirm_password').value = '';
        }

        // Permitir solo números en el campo de código
        document.addEventListener('DOMContentLoaded', function () {
            const tokenInput = document.getElementById('token');
            if (tokenInput) {
                tokenInput.addEventListener('input', function (e) {
                    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
                });
            }
        });
    </script>
</body>

</html>
