<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recordar contraseña</title>
    <style>
        :root {
            --red1: #A8181B;
            --red2: #df1d1d;
            --navy: #860404;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: "Arial", sans-serif;
        }

        /* Fondo general */

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, var(--red1) 0%, var(--red2) 100%);
            position: relative;
            /* para logos absolutos */
            overflow: hidden;
        }

        /* Logo grande en la esquina izquierda sobre el fondo rojo (fuera de la tarjeta) */

        .logo-left-large {
            position: absolute;
            left: 22px;
            top: 20px;
            z-index: 5;
            width: 120px;
            /* ajusta según necesites */
            height: auto;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
        }

        /* elementos decorativos tipo círculos en la esquina inferior-izquierda */

        .bg-circles {
            position: absolute;
            left: -40px;
            bottom: -40px;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.03) 0), repeating-radial-gradient(circle, rgba(255, 255, 255, 0.132) 0 6px, transparent 6px 12px);
            transform: rotate(-10deg);
            pointer-events: none;
            z-index: 1;
        }

        .bg-circles2 {
            position: absolute;
            right: 40px;
            bottom: -40px;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.071) 0, transparent 40%), repeating-radial-gradient(circle, rgba(255, 255, 255, 0.02) 0 6px, transparent 6px 12px);
            transform: rotate(-10deg);
            pointer-events: none;
            z-index: 2;
        }
        /* tarjeta blanca centrada */

        .card-wrap {
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 30px;
            /* espacio alrededor para que respire en pantallas pequeñas */
        }

        .card {
            width: 420px;
            /* ancho fijo cercano al diseño */
            background: #faf7f7;
            border-radius: 8px;
            padding: 28px 34px;
            box-shadow: 0 16px 22px rgba(0, 0, 0, 0.22);
            position: relative;
        }

        /* Logos dentro de la tarjeta (arriba, izquierda y derecha) */

        .card-logos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 150px;
            margin-bottom: 12px;
        }

        .card-logos img {
            height: 100px;
            width: auto;
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin: 6px 0 22px 0;
            font-weight: 700;
            color: #222;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #222;
        }

        .input-box {
            position: relative;
            margin-bottom: 22px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 44px 12px 14px;
            /* espacio para icono a la derecha */
            border-radius: 8px;
            border: 3px solid var(--navy);
            font-size: 15px;
            outline: none;
            background: transparent;
        }

        input::placeholder {
            color: #9a9a9a;
            font-style: italic;
        }

        /* icono ojo dentro input */

        .eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 6px;
            font-size: 18px;
            user-select: none;
        }

        /* Botón guardar */

        .btn-wrap {
            display: flex;
            justify-content: center;
            margin-top: 6px;
        }

        button {
            width: 60%;
            min-width: 160px;
            padding: 12px 18px;
            border-radius: 28px;
            border: 3px solid var(--navy);
            background: var(--red1);
            color: white;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(18, 18, 18, 0.671);
        }

        button:active {
            transform: translateY(1px);
        }

        /* responsive */

        @media (max-width:480px) {

            .card {
                width: 92%;
                padding: 20px;
                margin-top: 60px;
                /* espacio para que entre el logo arriba */
            }

            .card-logos img {
                height: 48px;
            }

            /* 👇 AQUÍ ESTÁ EL CAMBIO IMPORTANTE */
            .logo-left-large {
                width: 100px;
                top: 15px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 20;
            }

        }
    </style>
</head>

<body>

    <!-- Logo grande en la esquina izquierda sobre el fondo (fuera de la tarjeta) -->
    <img class="logo-left-large" src="byteers_logo.png" alt="Logo compañia">

    <!-- círculos decorativos abajo izquierda -->
    <div class="bg-circles" aria-hidden="true"></div>
    <div class="bg-circles2" aria-hidden="true"></div>


    <!-- tarjeta -->
    <div class="card-wrap">
        <div class="card" role="main">

            <!-- logos dentro de la tarjeta (arriba) -->
            <div class="card-logos">
                <img src="avt_logo.png" alt="Logo tarjeta izquierdo">
                <img src="fmvb_logo.jpg" alt="Logo tarjeta derecho">
            </div>

            <h2>Recordar contraseña</h2>

            <label for="email">Ingresa correo para verificación</label>
            <div class="input-box">
                <input id="email" type="email" placeholder="Correo electrónico" required />
            </div>

            <label for="password">Ingresa nueva contraseña</label>
            <div class="input-box">
                <input id="password" type="password" placeholder="Contraseña" />
                <div class="eye" onclick="togglePass()" title="Mostrar / ocultar contraseña">👁</div>
            </div>

            <div class="btn-wrap">
                <button type="button">Guardar</button>
            </div>

        </div>
    </div>

    <script>
        function togglePass() {
            const p = document.getElementById('password');
            p.type = (p.type === 'password') ? 'text' : 'password';
        }
    </script>
</body>

</html>
