<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recordar contraseña</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/usuarioContraseña.css', v=1) }}">
</head>

<body>
    <img src="{{ url_for('static', filename='img/byteers_logo.png') }}" alt="Byteers Logo" class="logobyteers">
    <!-- tarjeta -->
    <div class="card-wrap">
        <div class="card" role="main">

            <!-- logos dentro de la tarjeta (arriba) -->
            <div class="card-logos">
                <img src="{{ url_for('static', filename='img/logoAVT_vector.png') }}" alt="Logo tarjeta izquierdo">
                <img src="{{ url_for('static', filename='img/fmvb_logo.jpg') }}" alt="Logo tarjeta derecho">
            </div>

            <h2>Recordar contraseña</h2>

            <label for="email">Ingresa correo para verificación</label>
            <div class="input-box">
                <input id="email" type="email" placeholder="Correo electrónico" required />
            </div>

            <label for="password">Ingresa nueva contraseña</label>
            <div class="input-box">
                <input id="password" type="password" placeholder="Contraseña" />
                <div class="eye" onclick="togglePass()" title="Mostrar / ocultar contraseña">👁</div>
            </div>

            <div class="btn-wrap">
                <button type="button">Guardar</button>
            </div>

        </div>
    </div>

    <script>
        function togglePass() {
            const p = document.getElementById('password');
            p.type = (p.type === 'password') ? 'text' : 'password';
        }
    </script>
</body>

</html>
