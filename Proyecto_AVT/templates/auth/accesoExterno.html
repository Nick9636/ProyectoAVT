<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registro de SIRED</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/usuarioContraseña.css') }}">
</head>

<body>
    <img src="{{ url_for('static', filename='img/byteers_logo.png') }}" alt="Byteers Logo" class="logobyteers">

    <div class="card-wrap">
        <div class="card" role="main">

            <div class="card-logos">
                <img src="{{ url_for('static', filename='img/logoAVT_vector.png') }}" alt="Logo AVT">
                <img src="{{ url_for('static', filename='img/fmvb_logo.jpg') }}" alt="Logo FMVB">
            </div>

            <h2>Registro de SIRED</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('registroExterno') }}">
                <label for="email">Correo electrónico</label>
                <div class="input-box">
                    <input id="email" type="email" name="email" placeholder="Correo electrónico" required />
                </div>

                <label for="nombre">Nombre</label>
                <div class="input-box">
                    <input id="nombre" type="text" name="nombre" placeholder="Nombre" required />
                </div>

                <div class="btn-wrap">
                    <button type="submit">Guardar</button>
                </div>

            </form>

        </div>
    </div>

</body>

</html>
