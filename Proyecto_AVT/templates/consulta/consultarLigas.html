<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Ligas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

<body class="bg-gray-50 min-h-screen">
    {%include 'header.html'%}
    <main class="pt-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-900 mb-6">Buscar Ligas</h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre de la Liga</label>
                    <input type="text" id="nombreLiga" placeholder="Ingrese nombre de la liga"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Estado</label>
                    <select id="estadoLiga"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                        <option value="">Todos</option>
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </div>

                <button onclick="buscarLigas()"
                    class="bg-red-700 text-white px-8 py-3 rounded-xl hover:bg-red-800 transition-all font-semibold">
                    <i data-lucide="search" class="w-5 h-5 inline mr-2"></i>
                    Buscar Ligas
                </button>
            </div>
        </div>
        <!-- Resumen de ligas -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-md p-6 text-center">
                <div class="text-3xl font-bold text-green-600 mb-2">0</div>
                <div class="text-gray-600">Ligas Activas</div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6 text-center">
                <div class="text-3xl font-bold text-yellow-600 mb-2">0</div>
                <div class="text-gray-600">Ligas Inactivas</div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6 text-center">
                <div class="text-3xl font-bold text-blue-600 mb-2">0</div>
                <div class="text-gray-600">Total Equipos</div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6 text-center">
                <div class="text-3xl font-bold text-purple-600 mb-2">0</div>
                <div class="text-gray-600">Total Jugadores</div>
            </div>
        </div>

        <!-- Tabla de ligas -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">

            </div>

            <div class="overflow-x-auto">

                            <th class="px-6 py-3 text-left text-sm font-semibold">Equipos</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Jugadores</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Fecha Inicio</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">

                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 text-sm font-medium text-gray-900">-----</td>
                            <td class="px-6 py-4">
                                <div class="flex items-center space-x-2">

                                        class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">---</span>

                                </div>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-900">-- equipos</td>
                            <td class="px-6 py-4 text-sm text-gray-900">-- jugadores</td>
                            <td class="px-6 py-4 text-sm text-gray-900">--/--/----</td>
                            <td class="px-6 py-4">
                                <button onclick="verDetalles('municipal')"
                                    class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 transition-colors">
                                    Ver Detalles
                                </button>
                            </td>
                        </tr>
                        <!--<tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 text-sm font-medium text-gray-900">Liga Juvenil</td>
                            <td class="px-6 py-4">

                                </div>

                        </tr>

                            <td class="px-6 py-4">

                                    <button onclick="toggleEstado('femenil')" class="text-sm text-blue-600 hover:text-blue-800">Cambiar</button>
                                </div>

                            <td class="px-6 py-4 text-sm text-gray-900">6 equipos</td>
                            <td class="px-6 py-4 text-sm text-gray-900">72 jugadoras</td>
                            <td class="px-6 py-4 text-sm text-gray-900">25/01/2024</td>
                            <td class="px-6 py-4">
                                <button onclick="verDetalles('femenil')" class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 transition-colors">
                                    Ver Detalles
                                </button>
                            </td>
                        </tr>
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 text-sm font-medium text-gray-900">Liga Veteranos</td>
                            <td class="px-6 py-4">
                                <div class="flex items-center space-x-2">
                                    <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800">Inactivo</span>
                                    <button onclick="toggleEstado('veteranos')" class="text-sm text-blue-600 hover:text-blue-800">Cambiar</button>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-900">4 equipos</td>
                            <td class="px-6 py-4 text-sm text-gray-900">48 jugadores</td>
                            <td class="px-6 py-4 text-sm text-gray-900">10/02/2024</td>
                            <td class="px-6 py-4">
                                <button onclick="verDetalles('veteranos')" class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 transition-colors">
                                    Ver Detalles
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
