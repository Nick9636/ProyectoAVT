<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-gray-50 min-h-screen">
    {%include 'header.html'%}
    <main class="pt-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Formulario de búsqueda -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-900 mb-6">Buscar Personas Registradas</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre</label>
                    <input type="text" id="nombreBusqueda" placeholder="Ingrese nombre" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">CURP</label>
                    <input type="text" id="curpBusqueda" placeholder="Ingrese CURP" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Rol</label>
                    <select id="rolBusqueda" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                        <option value="">Todos los roles</option>
                        <option value="jugador">Jugador</option>
                        <option value="entrenador">Entrenador</option>
                        <option value="arbitro">Árbitro</option>
                    </select>
                </div>
            </div>
            
            <button onclick="buscarRegistros()" class="bg-red-700 text-white px-8 py-3 rounded-xl hover:bg-red-800 transition-all font-semibold">
                <i data-lucide="search" class="w-5 h-5 inline mr-2"></i>
                Buscar
            </button>
        </div>

        <!-- Resultados de búsqueda -->
        <div id="resultados" class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="p-6 border-b">
                <h3 class="text-xl font-semibold text-gray-900">Resultados de Búsqueda</h3>
                <p class="text-gray-600 text-sm mt-1">Se encontraron <span id="totalResultados">0</span> registros</p>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-red-700 text-white">
                        <tr>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Nombre</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">CURP</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Rol</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Estado</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Fecha Registro</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Acciones</th>
                        </tr>
                        
                    </thead>
                    
                </table>
            </div>
            
            <!-- Paginación -->
            <div class="bg-gray-50 px-6 py-3 flex justify-between items-center">
                <div class="text-sm text-gray-700">
                    Mostrando 1-1 de 0 registros
                </div>
                <div class="flex space-x-2">
                    <!--<button class="px-3 py-1 text-sm bg-white border rounded hover:bg-gray-50">Anterior</button>-->
                    <button class="px-3 py-1 text-sm bg-red-700 text-white rounded">1</button>
                    <!--<button class="px-3 py-1 text-sm bg-white border rounded hover:bg-gray-50">2</button>
                    <button class="px-3 py-1 text-sm bg-white border rounded hover:bg-gray-50">3</button>
                    <button class="px-3 py-1 text-sm bg-white border rounded hover:bg-gray-50">Siguiente</button>-->
                </div>
            </div>
        </div>
    </main>

</body>
