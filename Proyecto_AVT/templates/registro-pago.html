<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema AVT - Registrar Pago</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Barra superior -->
    <header class="bg-white shadow-md fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-3">
                    <button onclick="window.location.href='registro.html'" class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center hover:bg-gray-200 transition-colors">
                        <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
                    </button>
                    <div class="w-10 h-10 bg-red-700 rounded-lg flex items-center justify-center">
                        <i data-lucide="credit-card" class="w-6 h-6 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-red-700">Registrar Pago</h1>
                </div>
                
                <div class="flex items-center space-x-3">
                    <span class="text-gray-700">Hola, <span class="font-semibold">Usuario</span></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="pt-20 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="bg-white rounded-xl shadow-md p-8">
            <form id="formPago">
                <div class="space-y-6">
                    <!-- Seleccionar jugador -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Seleccionar Jugador *</label>
                        <div class="flex space-x-4">
                            <select id="jugadorSelect" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                                <option value="">Seleccionar de la lista</option>
                                <option value="juan">Juan Pérez García - AVT-2024-001</option>
                                <option value="maria">María González López - AVT-2024-002</option>
                                <option value="carlos">Carlos Martínez Ruiz - AVT-2024-003</option>
                            </select>
                            <button type="button" onclick="buscarJugador()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                                <i data-lucide="search" class="w-4 h-4 inline mr-2"></i>
                                Buscar
                            </button>
                        </div>
                    </div>

                    <!-- Información del jugador seleccionado -->
                    <div id="infoJugador" class="hidden bg-gray-50 rounded-lg p-4">
                        <h3 class="font-medium text-gray-900 mb-2">Información del Jugador</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                            <div>
                                <span class="text-gray-600">Nombre:</span>
                                <span id="nombreJugador" class="font-medium ml-2">Juan Pérez García</span>
                            </div>
                            <div>
                                <span class="text-gray-600">Registro:</span>
                                <span id="registroJugador" class="font-medium ml-2">AVT-2024-001</span>
                            </div>
                            <div>
                                <span class="text-gray-600">Equipo:</span>
                                <span id="equipoJugador" class="font-medium ml-2">Tigres FC</span>
                            </div>
                            <div>
                                <span class="text-gray-600">Liga:</span>
                                <span id="ligaJugador" class="font-medium ml-2">Liga Municipal</span>
                            </div>
                        </div>
                    </div>

                    <!-- Monto -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Monto *</label>
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">$</span>
                            <input type="number" id="monto" value="150" readonly class="w-full pl-8 pr-4 py-2 border border-gray-300 rounded-lg bg-gray-100 focus:ring-2 focus:ring-red-700 focus:border-red-700">
                        </div>
                        <p class="text-sm text-gray-500 mt-1">Monto fijo de inscripción</p>
                    </div>

                    <!-- Estado del pago -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Estado del Pago *</label>
                        <select id="estadoPago" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                            <option value="">Seleccionar estado</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="pagado">Pagado</option>
                            <option value="verificado">Verificado</option>
                        </select>
                    </div>

                    <!-- Concepto -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Concepto</label>
                        <select id="concepto" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                            <option value="inscripcion">Inscripción</option>
                            <option value="mensualidad">Mensualidad</option>
                            <option value="renovacion">Renovación</option>
                            <option value="torneo">Torneo especial</option>
                        </select>
                    </div>

                    <!-- Fecha de pago -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Pago</label>
                        <input type="date" id="fechaPago" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                    </div>

                    <!-- Observaciones -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Observaciones</label>
                        <textarea id="observaciones" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700" placeholder="Observaciones adicionales..."></textarea>
                    </div>
                </div>

                <!-- Alertas de validación -->
                <div id="alertas" class="mt-6 space-y-3"></div>

                <!-- Botón registrar -->
                <div class="mt-8 text-center">
                    <button type="submit" class="bg-red-700 text-white py-3 px-8 rounded-xl hover:bg-red-800 transition-all font-semibold">
                        <i data-lucide="credit-card" class="w-5 h-5 inline mr-2"></i>
                        Registrar Pago
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // Mostrar información del jugador al seleccionar
        document.getElementById('jugadorSelect').addEventListener('change', function() {
            const jugador = this.value;
            const infoDiv = document.getElementById('infoJugador');
            
            if (jugador) {
                infoDiv.classList.remove('hidden');
                // Aquí se cargarían los datos reales del jugador
            } else {
                infoDiv.classList.add('hidden');
            }
        });

        function buscarJugador() {
            // Simular búsqueda de jugador
            alert('Función de búsqueda de jugador');
        }

        function mostrarAlerta(tipo, titulo, mensaje) {
            const colores = {
                'error': 'bg-red-50 border-red-200 text-red-800',
                'warning': 'bg-yellow-50 border-yellow-200 text-yellow-800',
                'success': 'bg-green-50 border-green-200 text-green-800'
            };

            const iconos = {
                'error': 'x-circle',
                'warning': 'alert-triangle',
                'success': 'check-circle'
            };

            const alerta = `
                <div class="${colores[tipo]} border rounded-lg p-4 flex items-start space-x-3">
                    <i data-lucide="${iconos[tipo]}" class="w-5 h-5 mt-0.5"></i>
                    <div>
                        <p class="font-medium">${titulo}</p>
                        <p class="text-sm">${mensaje}</p>
                    </div>
                </div>
            `;

            document.getElementById('alertas').innerHTML = alerta;
            lucide.createIcons();
        }

        document.getElementById('formPago').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const jugador = document.getElementById('jugadorSelect').value;
            const monto = document.getElementById('monto').value;
            const estado = document.getElementById('estadoPago').value;

            // Limpiar alertas previas
            document.getElementById('alertas').innerHTML = '';

            if (!jugador) {
                mostrarAlerta('error', 'Jugador Requerido', 'Debe seleccionar un jugador para registrar el pago.');
                return;
            }

            if (!estado) {
                mostrarAlerta('error', 'Estado Requerido', 'Debe seleccionar el estado del pago.');
                return;
            }

            if (parseFloat(monto) !== 150) {
                mostrarAlerta('error', 'Monto Incorrecto', 'El monto debe ser exactamente $150.00 para inscripciones.');
                return;
            }

            // Simular validación de jugador afiliado
            const jugadoresAfiliados = ['juan', 'maria', 'carlos'];
            if (!jugadoresAfiliados.includes(jugador)) {
                mostrarAlerta('error', 'Jugador No Afiliado', 'El jugador seleccionado no está afiliado al sistema.');
                return;
            }

            mostrarAlerta('success', 'Pago Registrado', 'El pago se ha registrado exitosamente en el sistema.');
            
            setTimeout(() => {
                this.reset();
                document.getElementById('infoJugador').classList.add('hidden');
                document.getElementById('alertas').innerHTML = '';
            }, 2000);
        });
    </script>
</body>
</html>
