<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Persona</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="min-h-screen" onload="verificarSesion()">
    {% include 'header.html' %}
    <main class="pt-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">

        <div class="rounded-xl shadow-lg p-8">
            <form id="formPersona" onsubmit="guardarPersona(event)">

                <div class="card-ui rounded-lg shadow-lg p-8">
                    <form id="formPersona" onsubmit="guardarPersona(event)">
                        <!-- Tipo de Persona -->
                        <div class="mb-6">
                            <label class="block text-gray-700 font-semibold mb-3">
                                Tipo de Registro *
                            </label>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                                <label
                                    class="flex items-center space-x-3 bg-gray-50 p-4 rounded-lg cursor-pointer hover:bg-red-50 transition">
                                    <input type="radio" name="tipo_persona" value="jugador" required
                                        class="text-red-700 focus:ring-red-700">
                                    <span class="text-gray-700 font-medium">Jugador</span>
                                </label>

                                <label
                                    class="flex items-center space-x-3 bg-gray-50 p-4 rounded-lg cursor-pointer hover:bg-red-50 transition">
                                    <input type="radio" name="tipo_persona" value="arbitro" required
                                        class="text-red-700 focus:ring-red-700">
                                    <span class="text-gray-700 font-medium">Árbitro</span>
                                </label>

                                <label
                                    class="flex items-center space-x-3 bg-gray-50 p-4 rounded-lg cursor-pointer hover:bg-red-50 transition">
                                    <input type="radio" name="tipo_persona" value="entrenador" required
                                        class="text-red-700 focus:ring-red-700">
                                    <span class="text-gray-700 font-medium">Entrenador</span>
                                </label>

                            </div>
                        </div>
                        <!-- DATOS PERSONALES -->
                        <div class="bg-red-50 p-6 rounded-lg mb-6">
                            <h3 class="text-xl font-bold text-red-800 mb-4 flex items-center">
                                <span class="text-2xl mr-2"></span> Datos Personales
                            </h3>

                            <div class="grid grid-cols-3 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Apellido Paterno
                                        *</label>
                                    <input type="text" id="apellidoPaterno" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-red-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Apellido Materno
                                        *</label>
                                    <input type="text" id="apellidoMaterno" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-red-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre(s) *</label>
                                    <input type="text" id="nombres" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-red-500">
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Número de
                                        Registro</label>
                                    <input type="text" id="numeroRegistro"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">CURP *</label>
                                    <input type="text" id="curpPersona" required maxlength="18"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-red-500">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Año de Vigencia *</label>
                                <div class="flex gap-4">
                                    <label class="flex items-center">
                                        <input type="checkbox" name="vigencia" value="2025"
                                            class="mr-2 w-4 h-4 text-red-600"> 2025
                                    </label>
                                    <label class="flex items-center">
                                        <input type="checkbox" name="vigencia" value="2026"
                                            class="mr-2 w-4 h-4 text-red-600"> 2026
                                    </label>
                                    <label class="flex items-center">
                                        <input type="checkbox" name="vigencia" value="2027"
                                            class="mr-2 w-4 h-4 text-red-600"> 2027
                                    </label>
                                    <label class="flex items-center">
                                        <input type="checkbox" name="vigencia" value="2028"
                                            class="mr-2 w-4 h-4 text-red-600"> 2028
                                    </label>
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Nacimiento
                                        *</label>
                                    <input type="date" id="fechaNacimientoPersona" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Lugar de Nacimiento
                                        *</label>
                                    <input type="text" id="lugarNacimiento" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-red-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Nacionalidad *</label>
                                    <input type="text" id="nacionalidad" required value="MEXICANA"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-red-500">
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Peso (kg) *</label>
                                    <input type="number" id="peso" required step="0.1"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Estatura (m) *</label>
                                    <input type="number" id="estatura" required step="0.01"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de Sangre *</label>
                                    <select id="tipoSangre" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500">
                                        <option value="">Seleccionar</option>
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Ocupación</label>
                                    <input type="text" id="ocupacion"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-red-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Escolaridad</label>
                                    <input type="text" id="escolaridad"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-red-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Escuela</label>
                                    <input type="text" id="escuela"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-red-500">
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Enfermedades
                                        Crónicas</label>
                                    <input type="text" id="enfermedadesCronicas" placeholder="NINGUNA" value="NINGUNA"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-red-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Medicamentos</label>
                                    <input type="text" id="medicamentos" placeholder="NINGUNA" value="NINGUNA"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-red-500">
                                </div>
                            </div>
                        </div>

                        <!-- DOMICILIO -->
                        <div class="bg-blue-50 p-6 rounded-lg mb-6">
                            <h3 class="text-xl font-bold text-blue-800 mb-4 flex items-center">
                                <span class="text-2xl mr-2"></span> Domicilio
                            </h3>

                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Estado de Residencia
                                        *</label>
                                    <input type="text" id="estadoResidencia" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Municipio *</label>
                                    <input type="text" id="municipio" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Dirección (Calle y
                                        Número) *</label>
                                    <input type="text" id="direccion" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Colonia *</label>
                                    <input type="text" id="colonia" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Código Postal *</label>
                                    <input type="text" id="codigoPostal" required maxlength="5"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono</label>
                                    <input type="tel" id="telefono"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Celular *</label>
                                    <input type="tel" id="celular" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Correo Electrónico *</label>
                                <input type="email" id="email" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>

                        <!-- INFORMACIÓN DEPORTIVA -->
                        <div class="bg-green-50 p-6 rounded-lg mb-6">
                            <h3 class="text-xl font-bold text-green-800 mb-4 flex items-center">
                                <span class="text-2xl mr-2"></span> Información Deportiva
                            </h3>

                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Club y/o Escuela
                                        *</label>
                                    <input type="text" id="club" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-green-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Equipo *</label>
                                    <select id="equipoPersona" required class="w-full px-3 py-2 border border-gray-300 rounded-lg
               focus:ring-2 focus:ring-green-500">
                                        <option value="">Seleccionar equipo</option>
                                        {% for eq in equipos %}
                                        <option value="{{ eq['id_equipo'] }}">
                                            {{ eq['nombre_equipo'] }} — {{ eq['categoria'] }} ({{ eq['nombre_liga'] }})
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>

                            </div>

                            <div class="grid grid-cols-3 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Tipo *</label>
                                    <select id="tipoPersona" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                                        <option value="jugador">Jugador</option>
                                        <option value="árbitro">Árbitro</option>
                                        <option value="entrenador">Entrenador</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Categoría *</label>
                                    <select id="categoria" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                                        <option value="">Seleccionar</option>
                                        <option value="INFANTIL">INFANTIL</option>
                                        <option value="MENOR INFANTIL">MENOR INFANTIL</option>
                                        <option value="CADETE">CADETE</option>
                                        <option value="JUVENIL">JUVENIL</option>
                                        <option value="MAYOR">MAYOR</option>
                                        <option value="MASTER">MASTER</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Rama *</label>
                                    <select id="rama" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                                        <option value="">Seleccionar</option>
                                        <option value="VARONIL">VARONIL</option>
                                        <option value="FEMENIL">FEMENIL</option>
                                        <option value="MIXTO">MIXTO</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Ligas en las que Participa
                                    *</label>
                                <input type="text" id="ligasParticipa" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-green-500"
                                    placeholder="Ej: LIGA OFICIAL MUNICIPAL DE PANOTLA">
                            </div>
                        </div>

                        <!-- Campos solo para árbitro -->
                        <div id="camposArbitro" class="hidden bg-purple-50 p-6 rounded-lg mb-6">
                            <h3 class="text-xl font-bold text-purple-800 mb-4">Datos de Árbitro</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Licencia</label>
                                    <input type="text" id="licencia" class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase
                          focus:ring-2 focus:ring-purple-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Zona</label>
                                    <input type="text" id="zona" class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase
                          focus:ring-2 focus:ring-purple-500">
                                </div>
                            </div>
                        </div>

                        <!-- Campos solo para entrenador -->
                        <div id="camposEntrenador" class="hidden bg-teal-50 p-6 rounded-lg mb-6">
                            <h3 class="text-xl font-bold text-teal-800 mb-4">Datos de Entrenador</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Cédula</label>
                                    <input type="text" id="cedula" class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase
                          focus:ring-2 focus:ring-teal-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Especialidad</label>
                                    <input type="text" id="especialidad" class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase
                          focus:ring-2 focus:ring-teal-500">
                                </div>
                            </div>
                        </div>

                        <!-- PADRE O TUTOR -->
                        <div class="bg-yellow-50 p-6 rounded-lg mb-6">
                            <h3 class="text-xl font-bold text-yellow-800 mb-4 flex items-center">
                                <span class="text-2xl mr-2"></span> Padre o Tutor (En caso de ser menor de edad)
                            </h3>

                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Nombre Completo del
                                    Padre/Tutor</label>
                                <input type="text" id="nombrePadre"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-yellow-500">
                            </div>

                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Celular del
                                        Padre/Tutor</label>
                                    <input type="tel" id="celularPadre"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Correo Electrónico del
                                        Padre/Tutor</label>
                                    <input type="email" id="emailPadre"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Firma del
                                    Padre/Tutor</label>
                                <input type="text" id="firmaPadre"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-yellow-500"
                                    placeholder="DE CONFORMIDAD A LOS REGLAMENTOS DE LA AVT">
                            </div>
                        </div>

                        <!-- FOTOGRAFÍA -->
                        <div class="bg-gray-50 p-6 rounded-lg mb-6">
                            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                                <span class="text-2xl mr-2"></span> Fotografía
                            </h3>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Fotografía (PNG/JPG)</label>
                                <input type="file" id="fotoPersona" accept=".png,.jpg,.jpeg"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500">
                                <p class="text-sm text-gray-500 mt-1">Formato: PNG o JPG. Tamaño recomendado: foto tipo
                                    credencial</p>
                            </div>
                        </div>

                        <!-- BOTONES -->
                        <div class="flex gap-4 justify-end">
                            <a href="home.html"
                                class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 px-8 rounded-lg">
                                Cancelar
                            </a>
                            <button type="submit"
                                class="bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-8 rounded-lg shadow-lg">
                                Guardar Registro
                            </button>
                        </div>
                    </form>
                </div>
    </main>
    <script>
        function guardarPersona(event) {
            event.preventDefault();

            const form = document.getElementById('formPersona');
            const formData = new FormData(form);

            // Agregar campos con id (no tienen name en el HTML actual)
            const campos = [
                'apellidoPaterno', 'apellidoMaterno', 'nombres',
                'numeroRegistro', 'curpPersona', 'fechaNacimientoPersona',
                'lugarNacimiento', 'nacionalidad', 'peso', 'estatura',
                'tipoSangre', 'ocupacion', 'escolaridad', 'escuela',
                'enfermedadesCronicas', 'medicamentos', 'club',
                'equipoPersona', 'categoria', 'ligasParticipa',
                'estadoResidencia', 'municipio', 'direccion',
                'colonia', 'codigoPostal', 'telefono', 'celular', 'email',
                'nombrePadre', 'celularPadre', 'emailPadre', 'firmaPadre',
                'fotoPersona'
            ];
            const nombres_bd = [
                'apellido_paterno', 'apellido_materno', 'nombres',
                'numero_registro', 'curp', 'fecha_nacimiento',
                'lugar_nacimiento', 'nacionalidad', 'peso', 'estatura',
                'tipo_sangre', 'ocupacion', 'escolaridad', 'escuela',
                'enfermedades_cronicas', 'medicamentos', 'club',
                'id_equipo', 'categoria', 'ligas_participa',
                'estado_residencia', 'municipio', 'calle',
                'colonia', 'codigo_postal', 'telefono', 'celular', 'email',
                'nombre_padre', 'celular_padre', 'email_padre', 'firma_padre',
                'fotoPersona'
            ];

            campos.forEach((id, i) => {
                const el = document.getElementById(id);
                if (!el) return;
                if (el.type === 'file') {
                    if (el.files[0]) formData.append(nombres_bd[i], el.files[0]);
                } else {
                    formData.append(nombres_bd[i], el.value);
                }
            });

            // tipo_persona viene del radio button — ya tiene name="tipo_persona"

            fetch("{{ url_for('registro.guardarPersona') }}", {
                method: 'POST',
                body: formData
            })
                .then(r => r.json())
                .then(data => {
                    if (data.ok) {
                        alert(`✓ ${data.mensaje}`);
                        form.reset();
                    } else {
                        alert(`✗ Error: ${data.mensaje}`);
                    }
                })
                .catch(() => alert('Error de conexión'));
        }

        // Mostrar/ocultar campos según tipo seleccionado
        document.querySelectorAll('input[name="tipo_persona"]').forEach(radio => {
            radio.addEventListener('change', function () {
                const esArbitro = this.value === 'arbitro';
                const esEntrenador = this.value === 'entrenador';

                document.getElementById('camposArbitro')?.classList
                    .toggle('hidden', !esArbitro);
                document.getElementById('camposEntrenador')?.classList
                    .toggle('hidden', !esEntrenador);
            });
        });
    </script>

</body>

</html>
