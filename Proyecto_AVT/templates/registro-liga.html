<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema AVT - Registrar Liga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Barra superior -->
    <header class="bg-white shadow-md fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-3">
                    <button onclick="window.location.href='registro.html'" class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center hover:bg-gray-200 transition-colors">
                        <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
                    </button>
                    <div class="w-10 h-10 bg-red-700 rounded-lg flex items-center justify-center">
                        <i data-lucide="trophy" class="w-6 h-6 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-red-700">Registrar Liga</h1>
                </div>
                
                <div class="flex items-center space-x-3">
                    <span class="text-gray-700">Hola, <span class="font-semibold">Usuario</span></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="pt-20 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="bg-white rounded-xl shadow-md p-8">
            <form id="formLiga">
                <div class="space-y-6">
                    <!-- Nombre de la liga -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre de la Liga *</label>
                        <input type="text" id="nombreLiga" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700" placeholder="Ej: Liga Municipal de Fútbol">
                    </div>

                    <!-- Estado -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Estado *</label>
                        <select id="estado" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                            <option value="">Seleccionar estado</option>
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>

                    <!-- Descripción -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Descripción</label>
                        <textarea id="descripcion" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700" placeholder="Descripción opcional de la liga"></textarea>
                    </div>

                    <!-- Fecha de inicio -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Inicio</label>
                            <input type="date" id="fechaInicio" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Fin</label>
                            <input type="date" id="fechaFin" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                        </div>
                    </div>
                </div>

                <!-- Alerta de liga existente -->
                <div id="alertaExistente" class="hidden mt-6 bg-red-50 border border-red-200 rounded-lg p-4">
                    <div class="flex items-start space-x-3">
                        <i data-lucide="alert-circle" class="w-5 h-5 text-red-600 mt-0.5"></i>
                        <div>
                            <p class="text-red-800 font-medium">Liga Existente</p>
                            <p class="text-red-700 text-sm">Ya existe una liga con este nombre. Por favor elija un nombre diferente.</p>
                        </div>
                    </div>
                </div>

                <!-- Botón registrar -->
                <div class="mt-8 text-center">
                    <button type="submit" class="bg-red-700 text-white py-3 px-8 rounded-xl hover:bg-red-800 transition-all font-semibold">
                        <i data-lucide="trophy" class="w-5 h-5 inline mr-2"></i>
                        Registrar Liga
                    </button>
                </div>
            </form>
        </div>

        <!-- Lista de ligas existentes -->
        <div class="bg-white rounded-xl shadow-md p-8 mt-8">
            <h3 class="text-xl font-semibold text-gray-900 mb-6">Ligas Registradas</h3>
            
            <div class="overflow-x-auto">
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-red-700 text-white">
                            <th class="px-6 py-3 text-left text-sm font-semibold rounded-tl-lg">Nombre</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Estado</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold">Equipos</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold rounded-tr-lg">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 text-sm text-gray-900">Liga Municipal de Fútbol</td>
                            <td class="px-6 py-4">
                                <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">Activo</span>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-900">8 equipos</td>
                            <td class="px-6 py-4">
                                <button class="text-red-700 hover:text-red-900 mr-3">
                                    <i data-lucide="edit" class="w-4 h-4"></i>
                                </button>
                                <button class="text-gray-600 hover:text-gray-800">
                                    <i data-lucide="eye" class="w-4 h-4"></i>
                                </button>
                            </td>
                        </tr>
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 text-sm text-gray-900">Liga Juvenil</td>
                            <td class="px-6 py-4">
                                <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800">Inactivo</span>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-900">5 equipos</td>
                            <td class="px-6 py-4">
                                <button class="text-red-700 hover:text-red-900 mr-3">
                                    <i data-lucide="edit" class="w-4 h-4"></i>
                                </button>
                                <button class="text-gray-600 hover:text-gray-800">
                                    <i data-lucide="eye" class="w-4 h-4"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const ligasExistentes = ['Liga Municipal de Fútbol', 'Liga Juvenil'];

        // Validar nombre de liga existente
        document.getElementById('nombreLiga').addEventListener('blur', function() {
            const nombre = this.value.trim();
            const alerta = document.getElementById('alertaExistente');
            
            if (ligasExistentes.includes(nombre)) {
                alerta.classList.remove('hidden');
            } else {
                alerta.classList.add('hidden');
            }
        });

        // Manejar envío del formulario
        document.getElementById('formLiga').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombreLiga = document.getElementById('nombreLiga').value.trim();
            const estado = document.getElementById('estado').value;

            if (!nombreLiga || !estado) {
                alert('Por favor complete todos los campos requeridos');
                return;
            }

            if (ligasExistentes.includes(nombreLiga)) {
                alert('Ya existe una liga con este nombre');
                return;
            }

            // Simular registro exitoso
            alert('Liga registrada exitosamente');
            ligasExistentes.push(nombreLiga);
            this.reset();
            document.getElementById('alertaExistente').classList.add('hidden');
        });
    </script>
</body>
</html>
