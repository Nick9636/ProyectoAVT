<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar reporte de ingresos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

<body class="bg-gray-50 min-h-screen">
    {%include 'header.html'%}

        <!-- Filtros -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-900 mb-6">Filtros de Búsqueda</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Fecha Inicio</label>
                    <input type="date" id="fechaInicio" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Fecha Fin</label>
                    <input type="date" id="fechaFin" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Liga</label>
                    <select id="ligaFiltro" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                        <option value="">Todas las ligas</option>
                        <option value="municipal">Liga Municipal</option>
                        <option value="juvenil">Liga Juvenil</option>
                        <option value="femenil">Liga Femenil</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Estado</label>
                    <select id="estadoFiltro" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-700 focus:border-red-700">
                        <option value="">Todos</option>
                        <option value="pagado">Pagado</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="verificado">Verificado</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-6 flex space-x-4">
                <button onclick="aplicarFiltros()" class="bg-red-700 text-white px-6 py-2 rounded-lg hover:bg-red-800 transition-colors">
                    <i data-lucide="filter" class="w-4 h-4 inline mr-2"></i>
                    Aplicar Filtros
                </button>
                <button onclick="limpiarFiltros()" class="bg-gray-600 text-white px-6 py-2 rounded-lg hover:bg-gray-700 transition-colors">
                    <i data-lucide="x" class="w-4 h-4 inline mr-2"></i>
                    Limpiar
                </button>
            </div>
        </div>

        <!-- Resumen de ingresos -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-md p-6 text-center">
                <div class="text-3xl font-bold text-green-600 mb-2">$0</div>
                <div class="text-gray-600">Ingresos Totales</div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6 text-center">
                <div class="text-3xl font-bold text-blue-600 mb-2">$0</div>
                <div class="text-gray-600">Pagos Verificados</div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6 text-center">
                <div class="text-3xl font-bold text-yellow-600 mb-2">$0</div>
                <div class="text-gray-600">Pagos Pendientes</div>
            </div>
        </div>

                        <i data-lucide="file-text" class="w-4 h-4 inline mr-2"></i>

                    <button onclick="descargarExcel()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors text-sm">

                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Fecha</th>

            <!-- Paginación -->
            <div class="bg-gray-50 px-6 py-3 flex justify-between items-center">
                <div class="text-sm text-gray-700">
                    Mostrando 1-1 de 0 registros

                <div class="flex space-x-2">
                    <!--<button class="px-3 py-1 text-sm bg-white border rounded hover:bg-gray-50">Anterior</button>-->

            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        function aplicarFiltros() {
            alert('Filtros aplicados correctamente');
        }

        function limpiarFiltros() {
            document.getElementById('fechaInicio').value = '';
            document.getElementById('fechaFin').value = '';
            document.getElementById('ligaFiltro').value = '';
            document.getElementById('estadoFiltro').value = '';
        }

        function descargarPDF() {
            alert('Descargando reporte en PDF...');
        }

        function descargarExcel() {
            alert('Descargando reporte en Excel...');
        }

        function descargarGrafica() {
            alert('Descargando gráfica...');
        }
    </script>
